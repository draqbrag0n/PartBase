version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: partbase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: partbase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - partbase_postgres_data:/var/lib/postgresql/data

volumes:
  partbase_postgres_data: